[project]
name = "cesar-p2-engenharia-dados"
version = "0.1.0"
description = "Cesar School - Banco de Dados - 2o Período - Engenharia de Dados"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pymongo[srv]>=4.17.0",
    "pandas>=2.3.3,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg2-binary>=2.9.11,<3",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.optional-dependencies]
orchestration = ["prefect>=3.0,<4"]
spark = ["pyspark>=4.1,<5"]

[dependency-groups]
dev = ["pytest>=9,<10", "mongomock>=4.3,<5", "ruff>=0.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["spark: requer PySpark e Java", "postgres: requer PostgreSQL local descartavel"]
